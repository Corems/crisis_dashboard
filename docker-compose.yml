services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - nuxt
    networks:
      - public
      - internal

  nuxt:
    build: ./frontend
    environment:
      - API_URL=http://backend:8000
      - NUXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - public
      - internal

#  nuxt:
#    build: ./frontend
#    command: npm run dev
#    volumes:
#      - ./frontend:/app
#      - /app/node_modules
#    environment:
#      - API_URL=http://backend:8000
#      - NUXT_PUBLIC_API_URL=http://backend:8000
#    ports:
#      - "3000:3000"
#    depends_on:
#      - backend
#    networks:
#      - public
#      - internal

  backend:
    image: crisis_dashboard_backend
    command: python -m app.main
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/crisisdb
      - REDIS_URL=redis://redis:6379/0
      - FRED_API_KEY=${FRED_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TRANSPORT=${TRANSPORT:-grpc}
      - YT_PROXY_URL=${YT_PROXY_URL:-}
    ports:
      - "8000:8000"   # REST/Swagger — тільки для локального дебагу
      - "50051:50051" # gRPC
    depends_on:
      - postgres
      - redis
    networks:
      - internal
      - public

  celery-worker:
    image: crisis_dashboard_backend
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - PYTHONPATH=${PYTHONPATH:-/app}
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/crisisdb
      - REDIS_URL=redis://redis:6379/0
      - FRED_API_KEY=${FRED_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - internal

  celery-beat:
    image: crisis_dashboard_backend
    working_dir: /app
    command: sh -c "PYTHONPATH=/app celery -A app.celery_app beat --loglevel=info"
    environment:
      - PYTHONPATH=${PYTHONPATH:-/app}
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/crisisdb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=crisisdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - internal

networks:
  public:
  internal:
    internal: true   # цей network не виходить назовні

volumes:
  postgres_data:
  redis_data:
