server {
    listen 80;

    resolver 10.89.3.1 valid=10s ipv6=off;

    location / {
        set $upstream nuxt:3000;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        resolver 10.89.3.1 valid=10s ipv6=off;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
