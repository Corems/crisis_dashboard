syntax = "proto3";

package crisis;

// --- Indicators ---

message Indicator {
  string id = 1;
  string name = 2;
  double value = 3;
  double delta = 4;
  double weight = 5;
  double score = 6;
  string updated_at = 7;
}

message IndicatorsResponse {
  repeated Indicator indicators = 1;
  double total_score = 2;
  string calculated_at = 3;
}

// --- News ---

message NewsItem {
  string id = 1;
  string title = 2;
  string summary = 3;
  string source = 4;
  string url = 5;
  string published_at = 6;
}

message NewsResponse {
  repeated NewsItem items = 1;
}

// --- AI Analysis ---

message AnalysisResponse {
  string text = 1;
  double risk_score = 2;
  string generated_at = 3;
  bool cached = 4;
}

// --- Requests ---

message Empty {}

message NewsRequest {
  int32 limit = 1;
  string source = 2; // filter by source, optional
}

// --- Service ---

service CrisisService {
  rpc GetIndicators(Empty) returns (IndicatorsResponse);
  rpc GetNews(NewsRequest) returns (NewsResponse);
  rpc GetAnalysis(Empty) returns (AnalysisResponse);
}
